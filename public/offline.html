<script>
  // Auto-recovery, cross-browser and loop-safe. Two ways to land here:
  //  1. The browser is offline  → the `online` event (or the onLine poll on
  //     engines that drop the event) fires when connectivity returns.
  //  2. The browser is online but the SERVER was unreachable → onLine never
  //     changes, so we probe the server itself on a timer.
  // Either way we reload ONLY after a real fetch to the app succeeds — a
  // reload can never loop back to this page. One more guard: when the SW
  // serves this page the URL stays the page the user WANTED (/apps, …), so
  // reload re-fetches that page. But on a DIRECT visit to /offline.html the
  // URL is this file itself — reloading would fetch it again forever, so
  // direct visits leave for the dashboard instead.
  (function () {
    var msg = document.getElementById("msg"), hint = document.getElementById("hint"), ic = document.getElementById("ic");
    var reloading = false, checking = false;
    var direct = location.pathname.indexOf("/offline.html") === 0;

    // Two ways to land here, with different truthful wording:
    //  - the BROWSER is offline               → "You're offline"
    //  - the browser is fine, the SERVER died → "Can't reach FactoTasks"
    //    (network failure or a 5xx the service worker intercepted)
    function wording() {
      if (reloading) return;
      if (navigator.onLine === false) {
        msg.innerHTML = "You&rsquo;re offline";
        hint.textContent = "This page will refresh automatically when your connection returns.";
      } else {
        msg.innerHTML = "Can&rsquo;t reach FactoTasks";
        hint.textContent = "We're having a temporary hiccup. This page keeps retrying and will refresh by itself.";
      }
    }

    function goodbye() {
      if (reloading) return;
      reloading = true;
      msg.innerHTML = "Back online &mdash; refreshing&hellip;";
      ic.style.display = "none";
      hint.textContent = "";
      setTimeout(function () {
        if (direct) location.replace("/");
        else location.reload();
      }, 500);
    }

    // Probe the ACTUAL page the user wanted (not a synthetic path): we reload
    // only once it answers with something below 500 — a 200, a login redirect,
    // even a 404 all mean the app is alive and will render its own branded
    // screen. A persistent 5xx keeps us here retrying, so the reload can never
    // loop back into the service worker's fallback.
    function probe() {
      if (reloading || checking) return;
      if (typeof fetch !== "function") return; // ancient engine: message-only, no auto-refresh
      wording();
      if (navigator.onLine === false) return; // radio is off — a fetch can't succeed
      checking = true;
      var ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
      var kill = ctl && setTimeout(function () { ctl.abort(); }, 4000);
      fetch(location.pathname + location.search, { method: "HEAD", cache: "no-store", signal: ctl && ctl.signal })
        .then(function (res) { if (res && res.status < 500) goodbye(); })
        .catch(function () {})                     // still unreachable — keep waiting
        .then(function () { checking = false; if (kill) clearTimeout(kill); });
    }

    window.addEventListener("online", probe);
    window.addEventListener("offline", wording);
    setInterval(probe, 4000);
    probe();
  })();
</script>
